# Configuration for Windows 10/11 with NVIDIA GeForce RTX 2050 (4 GB VRAM)
platform:
  os: "windows"
  target_gpu: "NVIDIA GeForce RTX 2050 Laptop GPU"
  vram_total_mb: 4096
  vram_budget_mb: 3450 # Max allocation allowed to avoid OS DWM OOM
  preferred_backend: "cuda" # cuda | tensorrt | onnxruntime_cuda | directml
  fallback_backend: "directml"

inference:
  precision: "fp16" # fp16 | int8 | fp32
  enable_cuda_graphs: true
  enable_xformers: true
  enable_sdpa: true # PyTorch Scaled Dot Product Attention
  torch_compile: false # avoid JIT memory spike on 4GB
  max_batch_size: 1
  input_resolution: [720, 1280] # [height, width]
  internal_render_resolution: [512, 384] # VTON inference scale

pipeline:
  default_mode: "balanced" # realtime | balanced | quality
  frame_queue_max_depth: 2 # Bounded queue: discard stale frames if behind
  keyframe_interval: 12 # Keyframe every 12 frames in Balanced mode
  optical_flow_method: "farneback" # farneback | raft_light
  temporal_damping_factor: 0.28 # EMA smoothing for landmarks
  photometric_transfer: true # Transfer ambient lighting and wrinkles

garment_pipeline:
  auto_background_removal: true
  background_removal_model: "u2net_cloth" # u2net | isnet | rembg
  max_cache_size: 16
  anchor_detection: "geometric_hull"

person_analysis:
  pose_backend: "mediapipe_blazepose" # mediapipe | openpose
  pose_detection_confidence: 0.75
  segmentation_backend: "selfie_multiclass" # selfie_multiclass | human_parser
  segmentation_frequency: 2 # run human parsing every 2 frames
  arm_occlusion_feather_px: 4.0
