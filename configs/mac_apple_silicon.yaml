# Configuration for macOS (Apple Silicon M1/M2/M3/M4 & Intel Mac)
platform:
  os: "macos"
  target_hardware: "Apple Silicon (Unified Memory)"
  preferred_backend: "mps" # mps (Metal Performance Shaders) | coreml | cpu
  fallback_backend: "cpu"

inference:
  precision: "fp16"
  use_mps_graph: true
  enable_sdpa: true
  max_batch_size: 1
  input_resolution: [720, 1280]
  internal_render_resolution: [512, 384]

pipeline:
  default_mode: "balanced"
  frame_queue_max_depth: 2
  keyframe_interval: 10
  optical_flow_method: "farneback"
  temporal_damping_factor: 0.30
  photometric_transfer: true

garment_pipeline:
  auto_background_removal: true
  background_removal_model: "u2net_cloth"
  max_cache_size: 16

person_analysis:
  pose_backend: "mediapipe_blazepose"
  pose_detection_confidence: 0.75
  segmentation_backend: "selfie_multiclass"
  segmentation_frequency: 2
  arm_occlusion_feather_px: 4.0
